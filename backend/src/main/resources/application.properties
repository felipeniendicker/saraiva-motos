spring.application.name=saraiva-motos
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saraiva_motos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:saraiva}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.jackson.time-zone=America/Sao_Paulo

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.initial-user.email=${INITIAL_USER_EMAIL:}
app.initial-user.password=${INITIAL_USER_PASSWORD:}

app.upcitemdb.enabled=${UPCITEMDB_ENABLED:true}
app.upcitemdb.base-url=${UPCITEMDB_BASE_URL:https://api.upcitemdb.com/prod/trial}
app.upcitemdb.connect-timeout=${UPCITEMDB_CONNECT_TIMEOUT:2500ms}
app.upcitemdb.read-timeout=${UPCITEMDB_READ_TIMEOUT:4000ms}

app.tavily.enabled=${TAVILY_ENABLED:false}
app.tavily.api-key=${TAVILY_API_KEY:}
app.tavily.base-url=${TAVILY_BASE_URL:https://api.tavily.com}
app.tavily.connect-timeout=${TAVILY_CONNECT_TIMEOUT:2500ms}
app.tavily.read-timeout=${TAVILY_READ_TIMEOUT:4000ms}
